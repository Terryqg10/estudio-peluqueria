# .gitleaks.toml — Configuración de gitleaks para este proyecto.
# Se usa desde scripts/check-secrets.mjs y desde CI.

title = "web-os project"

[extend]
useDefault = true

[allowlist]
description = "Excepciones del proyecto"
paths = [
  '''\.env\.example$''',
  '''docs/''',
  '''README\.md$''',
  '''pnpm-lock\.yaml$''',
]
# Token de PRUEBA de 43 caracteres (alfabeto en orden): lo usan tests/unit/email-template.test.ts y
# tests/unit/send-confirmation.test.ts para construir un enlace de ejemplo. No es un secreto. Se permite el
# valor EXACTO, no los archivos: un secreto real en esos tests seguiría detectándose. (gitleaks 8.24 de la CI
# lo marca como generic-api-key; el 8.30 local, no.)
regexes = [
  '''abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNO12''',
]
